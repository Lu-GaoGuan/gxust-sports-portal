services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  web:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/backend/staticfiles
      - django_media:/app/backend/media
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - private

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - django_static:/srv/static:ro
      - django_media:/srv/media:ro
    networks:
      - private

volumes:
  mysql_data:
  django_static:
  django_media:

networks:
  private:
    driver: bridge
