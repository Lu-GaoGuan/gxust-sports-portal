  <circle cx="400" cy="255" r="76" fill="#0867d8" fill-opacity=".12"/>
  <path d="M355 255h90M400 210v90" stroke="#0867d8" stroke-width="14" stroke-linecap="round" opacity=".5"/>
  <text x="400" y="380" text-anchor="middle" fill="#315f91" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">图片待补充</text>
