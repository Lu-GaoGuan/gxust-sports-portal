services:
  - type: web
    name: gxust-sports-portal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_confirmed_content --if-empty
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: gxust-sports-portal-db
          property: connectionString
      - key: SEED_INITIAL_CONTENT
        value: "true"
      - key: SERVE_MEDIA_LOCALLY
        value: "true"

databases:
  - name: gxust-sports-portal-db
    databaseName: sports_portal
    user: sports_portal
